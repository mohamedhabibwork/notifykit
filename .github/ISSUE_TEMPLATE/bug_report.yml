name: Bug report
description: Report reproducible NotifyKit behavior that differs from expectations.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, recipient tokens, and other sensitive data.
  - type: input
    id: version
    attributes:
      label: NotifyKit version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node.js 22.23.1
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [FCM, Huawei Push Kit, Web Push, Email, Telegram, APNs, Custom]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include setup and message code with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true
